<button class="text-primary active:opacity-70 mr-4 flex items-center justify-center">

</button>
<h1 class="font-nav-title text-nav-title text-on-surface flex-1 text-center pr-[40px]">收款明细</h1>
</header>
<main class="pt-[64px] px-edge-margin space-y-section-gap">
<!-- Summary Section -->
<section class="bg-surface-container-lowest rounded-lg overflow-hidden border-[0.5px] border-outline-variant">
<div class="px-cell-padding-h py-cell-padding-v flex justify-between items-center border-b-[0.5px] border-outline-variant">

</div>
<div class="px-cell-padding-h py-cell-padding-v flex justify-between items-center border-b-[0.5px] border-outline-variant">

<span class="font-body-bold text-body-bold text-primary-container">¥ 1,500.00</span>
</div>
<div class="px-cell-padding-h py-cell-padding-v flex justify-between items-center">
<span class="font-cell-title text-cell-title text-on-surface">待收金额</span>
<span class="font-body-bold text-body-bold text-error">¥ 0.00</span>
</div>
</section>
<!-- Payment Records -->
<section>

<div class="bg-surface-container-lowest rounded-lg overflow-hidden border-[0.5px] border-outline-variant">

<div class="flex flex-col gap-1">
<span class="font-cell-title text-cell-title text-on-surface">微信支付</span>
<span class="font-label-desc text-label-desc text-on-surface-variant">2023-10-24 14:30:21</span>
</div>
<span class="font-cell-value text-cell-value text-on-surface">+ ¥ 1,000.00</span>
</div>
<!-- Record 2 -->
<div class="px-cell-padding-h py-cell-padding-v flex justify-between items-start">
<div class="flex flex-col gap-1">
<span class="font-cell-title text-cell-title text-on-surface">现金支付</span>
<span class="font-label-desc text-label-desc text-on-surface-variant">2023-10-24 15:45:00</span>
</div>
<span class="font-cell-value text-cell-value text-on-surface">+ ¥ 500.00</span>
</div>
</div>
</section>

        </button>
</div>
