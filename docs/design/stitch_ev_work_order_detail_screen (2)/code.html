<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>新建维修工单</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#111111",
                        "surface-container-highest": "#e5e5e5",
                        "on-secondary": "#ffffff",
                        "background": "#f7f7f7",
                        "tertiary-container": "#ff8475",
                        "on-secondary-fixed-variant": "#004b72",
                        "surface-container-high": "#f2f2f2",
                        "outline-variant": "#e5e5e5",
                        "on-primary-fixed-variant": "#005225",
                        "tertiary": "#a23d33",
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-container": "#f7f7f7",
                        "secondary-container": "#05acfd",
                        "tertiary-fixed-dim": "#ffb4aa",
                        "outline": "#b2b2b2",
                        "secondary-fixed": "#cbe6ff",
                        "inverse-on-surface": "#f2f2f2",
                        "on-surface-variant": "#333333",
                        "secondary": "#006495",
                        "primary-fixed": "#66ff95",
                        "on-primary": "#ffffff",
                        "surface-dim": "#e5e5e5",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "on-background": "#111111",
                        "on-tertiary-fixed-variant": "#82261e",
                        "surface-tint": "#07c160",
                        "surface-container-low": "#f7f7f7",
                        "on-secondary-fixed": "#001e31",
                        "primary": "#07c160",
                        "on-primary-fixed": "#00210b",
                        "inverse-surface": "#333333",
                        "surface-bright": "#ffffff",
                        "primary-fixed-dim": "#45e17c",
                        "on-primary-container": "#00471f",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#45e17c",
                        "on-tertiary-container": "#741c16",
                        "on-secondary-container": "#003d5d",
                        "on-tertiary-fixed": "#410001",
                        "surface": "#ffffff",
                        "tertiary-fixed": "#ffdad5",
                        "secondary-fixed-dim": "#90cdff",
                        "surface-variant": "#f2f2f2",
                        "on-error": "#ffffff",
                        "primary-container": "#07c160"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "card-gap": "12px",
                        "edge-margin": "16px",
                        "cell-padding-v": "16px",
                        "section-gap": "24px",
                        "safe-area-bottom": "34px",
                        "cell-padding-h": "16px"
                    },
                    "fontFamily": {
                        "nav-title": ["Inter", "sans-serif"],
                        "cell-title": ["Inter", "sans-serif"],
                        "button-text": ["Inter", "sans-serif"],
                        "body-main": ["Inter", "sans-serif"],
                        "label-desc": ["Inter", "sans-serif"],
                        "cell-value": ["Inter", "sans-serif"],
                        "body-bold": ["Inter", "sans-serif"]
                    },
                    "fontSize": {
                        "nav-title": ["17px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "cell-title": ["17px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "button-text": ["17px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-main": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-desc": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "cell-value": ["17px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-bold": ["16px", { "lineHeight": "24px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface-container font-sans text-on-surface antialiased select-none">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b-[0.5px] border-outline-variant flex items-center h-12 px-cell-padding-h transition-opacity duration-200">
<button class="active:opacity-70 text-on-surface mr-4 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="flex-1 text-center font-nav-title text-nav-title text-on-surface mr-10">工单详情</h1>
</header>
<!-- Main Content Canvas -->
<main class="pt-[60px] pb-[calc(100px+34px)] px-edge-margin flex flex-col gap-card-gap overflow-y-auto min-h-screen">
<!-- Section: Customer & Vehicle Info -->
<div class="bg-surface rounded-lg overflow-hidden border-[0.5px] border-outline-variant">
<div class="flex items-center px-cell-padding-h py-cell-padding-v border-b-[0.5px] border-outline-variant bg-surface">
<span class="font-cell-title text-cell-title text-on-surface w-24">客户姓名</span>
<input class="flex-1 font-cell-value text-cell-value text-on-surface bg-transparent focus:outline-none text-right placeholder-outline-variant border-none p-0 focus:ring-0" placeholder="请输入姓名" type="text"/>
</div>
<div class="flex items-center px-cell-padding-h py-cell-padding-v border-b-[0.5px] border-outline-variant bg-surface">
<span class="font-cell-title text-cell-title text-on-surface w-24">联系电话</span>
<input class="flex-1 font-cell-value text-cell-value text-on-surface bg-transparent focus:outline-none text-right placeholder-outline-variant border-none p-0 focus:ring-0" placeholder="请输入手机号" type="tel"/>
</div>
<div class="flex items-center px-cell-padding-h py-cell-padding-v border-b-[0.5px] border-outline-variant bg-surface">
<span class="font-cell-title text-cell-title text-on-surface w-24">车辆型号</span>
<div class="flex-1 flex justify-end items-center">
<input class="w-full font-cell-value text-cell-value text-on-surface bg-transparent focus:outline-none text-right placeholder-outline-variant border-none p-0 focus:ring-0" placeholder="选择或输入型号" type="text"/>
<span class="material-symbols-outlined text-outline ml-2 opacity-50" data-icon="chevron_right">chevron_right</span>
</div>
</div>
<div class="flex items-center px-cell-padding-h py-cell-padding-v border-b-[0.5px] border-outline-variant bg-surface">
<span class="font-cell-title text-cell-title text-on-surface w-24">车架号</span>
<input class="flex-1 font-cell-value text-cell-value text-on-surface bg-transparent focus:outline-none text-right placeholder-outline-variant border-none p-0 focus:ring-0" placeholder="扫码或输入VIN" type="text"/>
<button class="ml-3 text-primary-container active:opacity-70 flex items-center">
<span class="material-symbols-outlined" data-icon="qr_code_scanner">qr_code_scanner</span>
</button>
</div>
<div class="flex items-center px-cell-padding-h py-cell-padding-v bg-surface">
<span class="font-cell-title text-cell-title text-on-surface w-24">电池号</span>
<input class="flex-1 font-cell-value text-cell-value text-on-surface bg-transparent focus:outline-none text-right placeholder-outline-variant border-none p-0 focus:ring-0" placeholder="扫码或输入电池号" type="text"/>
<button class="ml-3 text-primary-container active:opacity-70 flex items-center">
<span class="material-symbols-outlined" data-icon="qr_code_scanner">qr_code_scanner</span>
</button>
</div>
</div>
<!-- Section: Service Description -->
<div class="bg-surface rounded-lg overflow-hidden border-[0.5px] border-outline-variant p-cell-padding-h">
<h2 class="font-cell-title text-cell-title text-on-surface mb-3">维修项目描述</h2>
<textarea class="w-full font-body-main text-body-main text-on-surface bg-surface-container-low rounded-lg p-3 border-none focus:ring-1 focus:ring-primary-container resize-none placeholder-outline-variant" placeholder="请详细描述故障现象及检查情况..." rows="3"></textarea>
</div>
<!-- Section: Parts Selection -->
<div class="bg-surface rounded-lg overflow-hidden border-[0.5px] border-outline-variant">
<div class="p-cell-padding-h border-b-[0.5px] border-outline-variant flex gap-3 items-center">
<div class="flex-1 bg-surface-container-high rounded-full flex items-center px-4 py-2">
<span class="material-symbols-outlined text-outline mr-2" data-icon="search">search</span>
<input class="flex-1 bg-transparent border-none p-0 font-body-main text-body-main focus:ring-0 text-on-surface placeholder-outline" placeholder="搜索配件名称或编码" type="text"/>
</div>
<button class="bg-surface-container-highest rounded-full w-10 h-10 flex items-center justify-center text-on-surface active:opacity-70">
<span class="material-symbols-outlined" data-icon="barcode_scanner">barcode_scanner</span>
</button>
</div>
<!-- Parts List (Empty State / Conceptual) -->
<div class="p-cell-padding-h py-8 flex flex-col items-center justify-center text-outline">
<span class="material-symbols-outlined text-4xl mb-2 opacity-50" data-icon="inventory_2">inventory_2</span>
<p class="font-label-desc text-label-desc">暂无选用配件</p>
</div>
</div>
<!-- Section: Fees -->
<div class="bg-surface rounded-lg overflow-hidden border-[0.5px] border-outline-variant mb-4">
<div class="flex items-center px-cell-padding-h py-cell-padding-v border-b-[0.5px] border-outline-variant bg-surface">
<span class="font-cell-title text-cell-title text-on-surface flex-1">人工费 (¥)</span>
<input class="w-32 font-cell-value text-cell-value text-on-surface bg-transparent focus:outline-none text-right placeholder-outline-variant border-none p-0 focus:ring-0" placeholder="0.00" type="number"/>
</div>
<div class="flex items-center px-cell-padding-h py-cell-padding-v bg-surface">
<span class="font-cell-title text-cell-title text-on-surface flex-1">其他费用 (¥)</span>
<input class="w-32 font-cell-value text-cell-value text-on-surface bg-transparent focus:outline-none text-right placeholder-outline-variant border-none p-0 focus:ring-0" placeholder="0.00" type="number"/>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 pb-safe-area-bottom border-t-[0.5px] border-outline-variant bg-surface flex justify-between items-center p-4">
<button class="flex-1 bg-surface-container-highest text-on-surface py-3 mx-2 rounded-lg flex justify-center items-center active:opacity-80 scale-95 duration-150 font-button-text text-button-text">
<span class="material-symbols-outlined mr-2" data-icon="close">close</span>
            取消工单
        </button>
<button class="flex-1 bg-primary text-on-primary py-3 mx-2 rounded-lg flex justify-center items-center active:opacity-80 scale-95 duration-150 font-button-text text-button-text">
<span class="material-symbols-outlined mr-2" data-icon="check_circle">check_circle</span>
            立即处理
        </button>
</nav>
</body></html>
