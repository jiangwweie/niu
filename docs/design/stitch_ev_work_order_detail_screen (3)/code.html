<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>工单结算与支付</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#edf6ea",
                        "outline": "#6c7b6c",
                        "on-primary-fixed-variant": "#005225",
                        "surface-bright": "#f3fcf0",
                        "surface-container": "#e8f0e4",
                        "on-primary-fixed": "#00210b",
                        "on-background": "#161d16",
                        "surface": "#f3fcf0",
                        "surface-tint": "#006d33",
                        "surface-container-highest": "#dce5d9",
                        "primary": "#006d33",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#ffb4aa",
                        "surface-container-high": "#e2ebdf",
                        "primary-container": "#07c160",
                        "error": "#ba1a1a",
                        "secondary-container": "#05acfd",
                        "on-tertiary-fixed-variant": "#82261e",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#45e17c",
                        "primary-fixed": "#66ff95",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed-variant": "#004b72",
                        "inverse-surface": "#2a322b",
                        "secondary-fixed-dim": "#90cdff",
                        "on-secondary-fixed": "#001e31",
                        "secondary-fixed": "#cbe6ff",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#3d4a3d",
                        "tertiary": "#a23d33",
                        "outline-variant": "#bbcbba",
                        "primary-fixed-dim": "#45e17c",
                        "on-surface": "#161d16",
                        "error-container": "#ffdad6",
                        "background": "#f7f7f7",
                        "tertiary-container": "#ff8475",
                        "on-secondary-container": "#003d5d",
                        "surface-variant": "#dce5d9",
                        "surface-dim": "#d4ddd1",
                        "secondary": "#006495",
                        "on-primary-container": "#00471f",
                        "tertiary-fixed": "#ffdad5",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-container": "#741c16",
                        "inverse-on-surface": "#eaf3e7",
                        "on-tertiary-fixed": "#410001"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "safe-area-bottom": "34px",
                        "section-gap": "24px",
                        "edge-margin": "16px",
                        "cell-padding-v": "16px",
                        "cell-padding-h": "16px",
                        "card-gap": "12px"
                    },
                    "fontFamily": {
                        "nav-title": ["Inter"],
                        "label-desc": ["Inter"],
                        "body-main": ["Inter"],
                        "cell-title": ["Inter"],
                        "body-bold": ["Inter"],
                        "cell-value": ["Inter"],
                        "button-text": ["Inter"]
                    },
                    "fontSize": {
                        "nav-title": ["17px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "label-desc": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-main": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "cell-title": ["17px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-bold": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "cell-value": ["17px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "button-text": ["17px", { "lineHeight": "24px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface pb-[120px]">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-background border-b-[0.5px] border-outline-variant flex items-center h-12 px-cell-padding-h transition-opacity duration-200">
<button class="active:opacity-70 text-on-surface mr-4">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-nav-title text-nav-title text-on-surface flex-1 text-center pr-8">工单详情</h1>
</header>
<!-- Main Content -->
<main class="pt-[60px] px-edge-margin space-y-section-gap">
<!-- Summary Section -->
<section class="bg-surface-container-lowest rounded-lg border-[0.5px] border-outline-variant overflow-hidden">
<div class="px-cell-padding-h py-cell-padding-v border-b-[0.5px] border-outline-variant flex justify-between items-center">
<span class="font-cell-title text-cell-title text-on-surface">工单编号</span>
<span class="font-cell-value text-cell-value text-on-surface-variant">WO-20231024-001</span>
</div>
<div class="px-cell-padding-h py-cell-padding-v border-b-[0.5px] border-outline-variant flex justify-between items-center">
<span class="font-cell-title text-cell-title text-on-surface">客户姓名</span>
<span class="font-cell-value text-cell-value text-on-surface-variant">张三先生</span>
</div>
<div class="px-cell-padding-h py-cell-padding-v flex justify-between items-center bg-surface-bright">
<span class="font-body-bold text-body-bold text-on-surface">应付总额</span>
<span class="font-body-bold text-body-bold text-error">￥1,270.00</span>
</div>
</section>
<!-- Status Logic Section -->
<section class="bg-surface-container-lowest rounded-lg border-[0.5px] border-outline-variant p-cell-padding-h space-y-card-gap">
<div class="flex justify-between items-center">
<span class="font-label-desc text-label-desc text-on-surface-variant">已收金额</span>
<span class="font-body-main text-body-main text-primary">￥500.00</span>
</div>
<div class="flex justify-between items-center">
<span class="font-label-desc text-label-desc text-on-surface-variant">待收金额</span>
<span class="font-body-bold text-body-bold text-error">￥770.00</span>
</div>
</section>
<!-- Interaction Branches -->
<section class="space-y-card-gap">
<h2 class="font-label-desc text-label-desc text-on-surface-variant pl-2">收款方式</h2>
<!-- Branch A: Manual -->
<button class="w-full bg-surface-container-lowest rounded-lg border-[0.5px] border-outline-variant p-cell-padding-h flex justify-between items-center active:opacity-70 transition-opacity">
<div class="flex items-center space-x-3">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">payments</span>
</div>
<div class="text-left">
<p class="font-cell-title text-cell-title text-on-surface">记录线下收款</p>
<p class="font-label-desc text-label-desc text-on-surface-variant">现金、转账等人工确认</p>
</div>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
<!-- Branch B: Digital -->
<button class="w-full bg-surface-container-lowest rounded-lg border-[0.5px] border-outline-variant p-cell-padding-h flex justify-between items-center active:opacity-70 transition-opacity">
<div class="flex items-center space-x-3">
<div class="w-10 h-10 rounded-full bg-primary-container/20 flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined">qr_code_scanner</span>
</div>
<div class="text-left">
<p class="font-cell-title text-cell-title text-on-surface">发起二维码收款</p>
<p class="font-label-desc text-label-desc text-on-surface-variant">微信、支付宝在线支付</p>
</div>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
</section>
</main>
<!-- Bottom Action Bar (Custom logic for Settlement, not the generic nav) -->
<div class="fixed bottom-0 w-full z-50 bg-surface-container-lowest border-t-[0.5px] border-outline-variant pb-safe-area-bottom px-edge-margin pt-4">
<button class="w-full bg-surface-variant text-on-surface-variant font-button-text text-button-text py-3 rounded-lg flex justify-center items-center opacity-60 cursor-not-allowed">
            完成结算
        </button>
<p class="text-center font-label-desc text-label-desc text-error mt-2">实收金额不足，不能结算。</p>
</div>
</body></html>
