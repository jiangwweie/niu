</div>

</div>
<div class="flex flex-col items-center z-10 w-1/5">
<div class="w-6 h-6 rounded-full bg-primary-container text-on-primary flex items-center justify-center mb-1">
<span class="font-body-bold text-[12px]">待检修</span>
</div>
<span class="font-label-desc text-label-desc text-primary-container font-medium">待检修</span>
</div>
<div class="flex flex-col items-center z-10 w-1/5">

</div>
<span class="font-label-desc text-label-desc text-on-surface-variant">已完成</span>
</div>
</div>
