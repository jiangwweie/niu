spring:
  application:
    name: xiaoniu-aftermarket-backend
  profiles:
    active: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

security:
  jwt:
    secret: ${JWT_SECRET:xiaoniu-aftermarket-dev-secret-change-me-please-2026}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:14400}

wx:
  miniapp:
    app-id: ${WX_MINIAPP_APPID:}
    app-secret: ${WX_MINIAPP_SECRET:}
