spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:14400}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  funding:
    upload-dir: ${FUNDING_UPLOAD_DIR:/opt/niu/uploads/funding}

wx:
  miniapp:
    app-id: ${WX_MINIAPP_APPID}
    app-secret: ${WX_MINIAPP_SECRET}
