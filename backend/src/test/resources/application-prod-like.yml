spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:xiaoniu_aftermarket_prod_like;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

security:
  jwt:
    secret: prod-like-test-secret-that-is-long-enough-to-pass-validation
